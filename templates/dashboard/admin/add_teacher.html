{% extends "dashboard/admin_dashboard_base.html" %}
{% load static %}

{% block title %}Add Teacher{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="mb-4">
    <h2>Add Teacher</h2>
    <p>Create a new teacher account.</p>
  </div>

  <div class="card p-4">
    <!-- Important: enctype is required for image upload -->
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Name -->
      <div class="mb-3">
        <label class="form-label">Name</label>

        <input type="text" name="name" class="form-control" required />
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>

        <input type="email" name="email" class="form-control" required />
      </div>

      <!-- Phone -->
      <div class="mb-3">
        <label class="form-label">Phone</label>

        <input type="text" name="phone" class="form-control" required />
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="form-label">Password</label>

        <input type="password" name="password" class="form-control" required />
      </div>

      <button type="submit" class="btn btn-primary">Add Teacher</button>

      <a href="{% url 'admin_teachers' %}" class="btn btn-secondary">
        Cancel
      </a>
    </form>
  </div>
</div>

{% endblock %}
