{% extends "dashboard/admin_dashboard_base.html" %}
{% load static %}

{% block title %}Edit Student{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% endblock %}


{% block content %}

<div class="container-fluid admin-students">

    <div class="student-page-header">
        <div>
            <h2>Edit Student</h2>
            <p>Update student account information.</p>
        </div>
    </div>


    <div class="card">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}


                <!-- Name -->
                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input 
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ student.name }}"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input 
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ student.email }}"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input 
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ student.phone }}"
                    >

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label class="form-label">
                        New Password
                    </label>

                    <input 
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Leave empty to keep current password"
                    >

                </div>



                <div class="d-flex gap-2">

                    <button 
                        type="submit" 
                        class="btn btn-primary"
                    >
                        Update Student
                    </button>


                    <a 
                        href="{% url 'admin_students' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>


            </form>

        </div>

    </div>

</div>


{% endblock %}
