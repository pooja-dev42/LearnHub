{% extends "dashboard/admin_dashboard_base.html" %}
{% load static %}

{% block title %}Add Subject{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h2>Add Subject</h2>
        <p>Create a new subject for LearnHub courses.</p>
    </div>

    <div class="card">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <!-- Subject Name -->
                <div class="mb-3">
                    <label class="form-label">Subject Name</label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter subject name"
                        required
                    >
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label class="form-label">Description</label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Enter subject description"
                    ></textarea>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i>
                        Add Subject
                    </button>

                    <a
                        href="{% url 'admin_subjects' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
