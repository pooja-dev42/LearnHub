{% extends "dashboard/admin_dashboard_base.html" %}
{% load static %}

{% block title %}Edit Subject{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h2>Edit Subject</h2>
        <p>Update subject information.</p>
    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Subject Name</label>

            <input
                type="text"
                name="name"
                class="form-control"
                value="{{ subject.name }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea
                name="description"
                class="form-control"
                rows="4"
            >{{ subject.description }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{% url 'admin_subjects' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
